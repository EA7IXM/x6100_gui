name: CQHAM quick check
# EA7IXM fork: compiles only the CQHAM sources on a PC (a couple of minutes,
# syntax and types), so a typo is caught before the 1.5 h image build.
on:
  workflow_dispatch:
  push:
    branches: [ea7ixm]
    paths:
      - 'src/cqham/**'
      - 'src/dialog_cqham.*'
      - 'src/meter_needle.*'
      - '.github/workflows/cqham-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Control library headers
      run: |
        git clone --depth 1 https://github.com/OpenX6100/X6100Control.git /tmp/x6100control
        # api.h is generated by the library's CMake (export macro)
        f=/tmp/x6100control/include/aether_radio/x6100_control/api.h
        if [ ! -f "$f" ]; then
          echo '#pragma once' > "$f"
          echo '#define AETHER_X6100CTRL_API' >> "$f"
          echo '#define AETHER_X6100CTRL_NO_EXPORT' >> "$f"
        fi

    - name: Packages
      run: sudo apt-get update && sudo apt-get install -y gcc libgnutls28-dev libpulse-dev libliquid-dev

    - name: Compile the CQHAM sources (no link)
      run: |
        fail=0
        FLAGS="-std=c11 -D_GNU_SOURCE -DLV_CONF_INCLUDE_SIMPLE -Wall -Wextra -Wno-unused-parameter
               -Werror=implicit-function-declaration -Werror=incompatible-pointer-types
               -Werror=int-conversion -Werror=return-type
               -I. -Isrc -Ilvgl -I/tmp/x6100control/include"
        for f in src/cqham/cqham_adpcm.c src/cqham/cqham_bands.c src/cqham/cqham_net.c \
                 src/cqham/cqham_client.c src/cqham/cqham_audio.c src/dialog_cqham.c src/meter_needle.c; do
          echo "== $f"
          gcc $FLAGS -c "$f" -o /tmp/out.o || fail=1
        done
        exit $fail
